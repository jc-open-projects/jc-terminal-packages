# JC Terminal V2 패키지 빌드 설정 — 워크플로와 packaging/*.sh 가 source 한다.
# 결정: jc-terminal-v2 DEC-010·012~016 (docs/03 §6.1). 빌드는 GitHub 호스팅 러너 (DEC-015)

# 앱 ID 가 $PREFIX 를 정한다 (DEC-003)
JC_APP_PACKAGE_NAME="com.jc.terminal2"
JC_PREFIX="/data/data/${JC_APP_PACKAGE_NAME}/files/usr"

# 빌드 레시피 — termux-packages 를 커밋 하나로 고정한다 (DEC-013). 갱신은 이 값만 바꾸고 다시 굽는다.
JC_TERMUX_PACKAGES_REPO="https://github.com/termux/termux-packages.git"
JC_TERMUX_PACKAGES_REF="3d362cd0ded930b9d8ba3798f589c94fadfd2ac4"

# 이 저장소 (DEC-010)
JC_GITHUB_REPO="jc-open-projects/jc-terminal-packages"
# apt 저장소 — GitHub Pages (gh-pages 브랜치의 뿌리)
JC_PAGES_BRANCH="gh-pages"
JC_REPO_URL="https://jc-open-projects.github.io/jc-terminal-packages"
# 부트스트랩·소스 묶음은 Releases 자산
JC_RELEASE_URL="https://github.com/${JC_GITHUB_REPO}/releases/download"

# 서명 키 (DEC-012) — 공개 키는 keys/ 에, 개인 키는 Actions 시크릿 JC_PACKAGES_GPG_KEY
JC_KEY_FILE="keys/jc-terminal-packages.asc"

# 부트스트랩에 들어가는 패키지 (DEC-014 — 1판 최소 세트에서 termux-am-socket 을 뺌, DEC-016).
# generate-bootstraps.sh 가 기본으로 받아 가는 것도 우리 저장소에 있어야 하므로 모두 적는다.
# 상위 패키지로 적는 것: libbz2 → bzip2, libcurl → curl, liblzma → xz-utils
JC_BOOTSTRAP_PACKAGES="
apt
bash
libbz2
command-not-found
coreutils
libcurl
dash
debianutils
diffutils
dos2unix
ed
findutils
gawk
grep
gzip
inetutils
less
lsof
nano
net-tools
patch
procps
psmisc
sed
tar
termux-core
termux-exec
termux-keyring
termux-tools
unzip
util-linux
liblzma
ca-certificates
"

# 부트스트랩에 함께 담는 패키지 (generate-bootstraps.sh --add) — 그 스크립트의 기본 목록에 없는 것.
# gnupg 도 여기 (기본 목록에는 gpgv 만 있다)
JC_BOOTSTRAP_EXTRA="
gnupg
curl
git
openssh
tmux
"

# 저장소 첫 판에 더 올리는 패키지 (DEC-014) — 부트스트랩에는 넣지 않는다
JC_REPO_EXTRA="
vim
htop
python
rsync
ripgrep
jq
make
clang
"

# 부트스트랩에 없어야 하는 패키지 — verify-bootstrap.sh 가 확인한다.
# termux-am-socket: Termux 앱의 소켓 서버용이라 우리 앱에서 쓰지 못한다. termux-tools 의 의존에서도 뺀다 (DEC-016)
JC_BOOTSTRAP_EXCLUDE="termux-am-socket"

# termux-tools 레시피에 우리가 판(REVISION)을 얼마나 더하나 — 우리 패치(patch-termux-packages.sh 7)를 바꿀 때마다 1 씩 올린다.
# 2: termux-am-socket 뺌(+1) · 미러를 우리 것 하나로(+1)
JC_TERMUX_TOOLS_REVISION_BUMP=2

# 하위 패키지(curl·clang 등)는 plan-builds.sh 가 상위 레시피(libcurl·libllvm)로 찾아 굽는다 (recipes.sh)

# 아키텍처 — 우선 arm64 (01 §7)
JC_ARCHITECTURES="aarch64"
