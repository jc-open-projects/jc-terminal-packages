name: Packages and bootstrap

# JC Terminal V2 패키지를 우리 prefix(/data/data/com.jc.terminal2/files/usr)로 굽고, 서명한 apt 저장소(GitHub Pages)와
# 부트스트랩 zip(Releases)을 만든다 — jc-terminal-v2 DEC-010·012~016 (docs/03 §6.1).
#
# GitHub 호스팅 러너에서 돈다 (DEC-015). 잡 6시간 제한에 맞춰 레시피마다 잡을 나누고, 의존성은 우리 apt 저장소의
# deb 를 받아 쓴다(build-package.sh -i). 저장소에 같은 판이 있는 레시피는 굽지 않는다 — 바뀐 것만 다시 굽는다.
# 서명 키 시크릿을 쓰므로 수동 실행만 한다 (포크 PR 은 돌리지 못함).
#
#   plan → build (레시피마다) → publish (apt 저장소·소스) → bootstrap (선택)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '구울 패키지 (공백 구분) · "all" = 부트스트랩 묶음 + JC_REPO_EXTRA · "bootstrap" · "repo-extra"'
        type: string
        default: 'all'
      force_rebuild:
        description: '다시 굽기: none(바뀐 것만) / listed(적은 것 모두, -f) / all(의존성까지, -F)'
        type: choice
        default: none
        options: [none, listed, all]
      publish_repo:
        description: 'apt 저장소 갱신·서명·푸시, 소스 올리기'
        type: boolean
        default: true
      make_bootstrap:
        description: '부트스트랩 zip 만들기·서명·릴리스'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: packages
  cancel-in-progress: false

env:
  ARCH: aarch64
  TP: termux-packages

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      recipes: ${{ steps.plan.outputs.recipes }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: termux-packages 고정 판 + 우리 패치
        run: packaging/checkout-termux-packages.sh "$TP"
      - name: 구울 레시피 고르기
        id: plan
        run: |
          set -euo pipefail
          . packaging/jc-packages.conf
          case "${{ inputs.packages }}" in
            ""|all)     PKGS="$JC_BOOTSTRAP_PACKAGES $JC_BOOTSTRAP_EXTRA $JC_REPO_EXTRA" ;;
            bootstrap)  PKGS="$JC_BOOTSTRAP_PACKAGES $JC_BOOTSTRAP_EXTRA" ;;
            repo-extra) PKGS="$JC_REPO_EXTRA" ;;
            *)          PKGS="${{ inputs.packages }}" ;;
          esac
          : > Packages
          for a in "$ARCH" all; do
            curl -fsSL "$JC_REPO_URL/dists/stable/main/binary-$a/Packages" >> Packages || echo "[*] binary-$a 없음 (첫 판)"
          done
          FORCE=""; [ "${{ inputs.force_rebuild }}" != none ] && FORCE="--force"
          packaging/plan-builds.sh "$TP" Packages $FORCE $PKGS > recipes.txt
          echo "recipes=$(jq -Rsc 'split("\n") | map(select(length > 0))' recipes.txt)" >> "$GITHUB_OUTPUT"
          echo "count=$(grep -c . recipes.txt || true)" >> "$GITHUB_OUTPUT"
          { echo "### 구울 레시피 ($(grep -c . recipes.txt || true))"; sed 's/^/- /' recipes.txt; } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 호스팅 러너의 잡 한도 — 넘는 레시피가 나오면 다시 묻는다 (DEC-015)
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        recipe: ${{ fromJSON(needs.plan.outputs.recipes) }}
    steps:
      - uses: actions/checkout@v4
      - name: termux-packages 고정 판 + 우리 패치
        run: packaging/checkout-termux-packages.sh "$TP"
      # run-docker.sh 는 termux-packages 폴더 안에서 돌아야 한다 (./scripts/… 를 상대 경로로 읽음)
      - name: 빌드 컨테이너·디스크
        working-directory: ${{ env.TP }}
        run: |
          ./scripts/run-docker.sh true
          ./scripts/free-space.sh
          df -h /
      - name: 안드로이드 SDK (termux-am 용)
        if: matrix.recipe == 'termux-am'
        working-directory: ${{ env.TP }}
        run: |
          mkdir -p jc && cp "$GITHUB_WORKSPACE/packaging/prep-android-sdk.sh" jc/
          ./scripts/run-docker.sh bash jc/prep-android-sdk.sh /home/builder/.termux-build/jc-android-sdk
      - name: 굽기 — ${{ matrix.recipe }}
        working-directory: ${{ env.TP }}
        env:
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env ANDROID_HOME=/home/builder/.termux-build/jc-android-sdk
        run: |
          set -o pipefail
          FORCE=""
          case "${{ inputs.force_rebuild }}" in listed) FORCE="-f" ;; all) FORCE="-F" ;; esac
          # -i: 의존성은 우리 저장소에서 받고(서명 확인), 없거나 판이 다르면 그 자리에서 굽는다
          ./scripts/run-docker.sh ./build-package.sh -i -C -a "$ARCH" $FORCE "${{ matrix.recipe }}" 2>&1 | tail -n 3000
          ls output
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.recipe }}
          path: ${{ env.TP }}/output/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: always() && inputs.publish_repo && needs.plan.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: termux-packages 고정 판 + 우리 패치
        run: packaging/checkout-termux-packages.sh "$TP"
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: new-debs
          merge-multiple: true
      - name: 새 deb
        id: new
        run: |
          mkdir -p new-debs
          n=$(find new-debs -name '*.deb' | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "새 deb $n개"; ls new-debs || true
      - name: 서명 키 가져오기
        if: steps.new.outputs.count != '0'
        env:
          KEY: ${{ secrets.JC_PACKAGES_GPG_KEY }}
          PASS: ${{ secrets.JC_PACKAGES_GPG_PASSPHRASE }}
        run: packaging/import-key.sh
      # apt 저장소 = gh-pages 브랜치의 뿌리. 이미 올린 deb 와 새 deb 를 합쳐 다시 만들고 서명한다
      - name: apt 저장소 만들기·서명·푸시
        if: steps.new.outputs.count != '0'
        run: packaging/publish-repo.sh new-debs "${{ github.run_number }}"
      - name: 소스 올리기 (릴리스 sources)
        if: steps.new.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(for f in new-debs/*.deb; do b=$(basename "$f"); echo "${b%%_*}"; done | sort -u)
          packaging/upload-sources.sh "$TP" $names
      - name: 서명 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

  bootstrap:
    needs: [plan, build, publish]
    if: always() && inputs.make_bootstrap && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) && contains(fromJSON('["success","skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: termux-packages 고정 판 + 우리 패치
        run: packaging/checkout-termux-packages.sh "$TP"
      - name: 서명 키 가져오기
        env:
          KEY: ${{ secrets.JC_PACKAGES_GPG_KEY }}
          PASS: ${{ secrets.JC_PACKAGES_GPG_PASSPHRASE }}
        run: packaging/import-key.sh
      - name: 부트스트랩 만들기
        id: boot
        run: |
          set -euo pipefail
          . packaging/jc-packages.conf
          # 방금 푸시한 저장소를 Pages 배포를 기다리지 않고 그대로 쓴다
          git fetch -q origin "$JC_PAGES_BRANCH"
          git worktree add -q pages "origin/$JC_PAGES_BRANCH"
          nohup python3 -m http.server 8088 --bind 127.0.0.1 --directory pages > /tmp/httpd.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS "http://127.0.0.1:8088/dists/stable/Release" -o /dev/null && break; sleep 1; done
          (cd "$TP" && rm -f bootstrap-*.zip && ./scripts/generate-bootstraps.sh --architectures "$ARCH" --repository "http://127.0.0.1:8088" --add "$(echo $JC_BOOTSTRAP_EXTRA | tr ' ' ',')")
          packaging/retarget-bootstrap.sh "$TP/bootstrap-$ARCH.zip"
          echo "zip=$TP/bootstrap-$ARCH.zip" >> "$GITHUB_OUTPUT"
      # 부트스트랩 안의 경로가 정말 우리 것인지, 빼기로 한 것이 빠졌는지 — 여기서 걸러야 앱이 헛돈다
      - name: 부트스트랩 확인
        run: packaging/verify-bootstrap.sh "${{ steps.boot.outputs.zip }}"
      - name: 부트스트랩 소스 올리기 (릴리스 sources)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(unzip -p "${{ steps.boot.outputs.zip }}" var/lib/dpkg/status | awk '/^Package: /{print $2}')
          packaging/upload-sources.sh "$TP" $names
      - name: 부트스트랩 서명·릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/release-bootstrap.sh "${{ steps.boot.outputs.zip }}" "bootstrap-$(date -u +%Y%m%d)-${{ github.run_number }}"
      - name: 서명 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"
